<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="findup-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Icon Container -->
  <rect width="64" height="64" rx="16" fill="url(#findup-grad)" />
  
  <!-- Search Lens -->
  <circle cx="28" cy="28" r="12" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#shadow)" />
  
  <!-- Search Handle -->
  <path d="M37 37L48 48" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" filter="url(#shadow)" />
  
  <!-- FindUp Pin / Arrow Sparkle inside Search Glass -->
